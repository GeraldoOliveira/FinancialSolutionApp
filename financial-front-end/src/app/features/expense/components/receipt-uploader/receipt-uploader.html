<div class="receipt-uploader space-y-2">
  <input 
    type="file" 
    #fileInput 
    class="hidden" 
    accept="image/*,application/pdf"
    (change)="onFileSelected($event)">

  @if (!previewUrl()) {
    <div 
      class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-4 text-center cursor-pointer transition-colors bg-slate-800/40 hover:bg-slate-800/70"
      (click)="fileInput.click()">
      <div class="flex flex-col items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-base shadow-sm">
          <i class="fas fa-receipt"></i>
        </div>
        <div>
          <p class="text-xs font-semibold text-slate-200">Clique para anexar o comprovante</p>
          <p class="text-[11px] text-slate-400">PNG, JPG ou PDF até 5MB</p>
        </div>
        <button type="button" (click)="fileInput.click(); $event.stopPropagation()" 
          class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-indigo-500/40 text-indigo-400 hover:bg-indigo-500/10 text-xs font-medium transition-colors">
          <i class="fas fa-upload"></i>
          <span>Escolher Arquivo</span>
        </button>
      </div>
    </div>
  } @else {
    <div class="relative p-3 rounded-2xl bg-slate-800/60 border border-slate-700/60 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 text-xs text-slate-300 truncate">
          <i class="fas fa-paperclip text-indigo-400 shrink-0"></i>
          <span class="truncate font-medium">{{ receiptName() }}</span>
        </div>
        <button type="button" (click)="clearReceipt()" 
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border border-rose-500/30 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 text-xs font-medium transition-all">
          <i class="fas fa-trash-alt"></i>
          <span>Remover</span>
        </button>
      </div>

      <div class="rounded-xl overflow-hidden border border-slate-700/60 flex items-center justify-center bg-slate-950/50 max-h-48">
        <img [src]="previewUrl()" alt="Recibo" class="max-h-48 w-auto object-contain">
      </div>
    </div>
  }
</div>
