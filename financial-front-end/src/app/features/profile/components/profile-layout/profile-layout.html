<div class="min-h-screen text-slate-100 bg-[#0B0F19] py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto space-y-6">
    <header class="space-y-1">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Perfil de Usuário</h1>
      <p class="text-slate-400 text-xs sm:text-sm">Gerencie suas configurações de conta e preferências.</p>
    </header>
    
    <app-tab-navigation
      [tabs]="settingsTabs" 
      [activeRoute]=""
      (tabSelected)="handleTabChange($event)">
    </app-tab-navigation>
    
    <main class="pt-2">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
