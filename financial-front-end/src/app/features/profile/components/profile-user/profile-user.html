<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="bg-slate-900/90 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl space-y-6">
    
    <div class="flex flex-col items-center gap-4 text-center pb-6 border-b border-slate-800">
      <div class="relative group shrink-0">
        @if (user?.imageUpload || user?.image) {
          <img [src]="user?.imageUpload || user?.image" alt="User avatar" 
            class="w-28 h-28 rounded-full object-cover border-4 border-indigo-500/40 shadow-xl shadow-indigo-500/10 ring-4 ring-indigo-500/10">
        } @else {
          <div class="w-28 h-28 rounded-full bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-500 flex items-center justify-center text-white font-extrabold text-3xl shadow-xl shadow-indigo-500/20 border-4 border-indigo-500/30">
            {{ (user?.name || 'U').charAt(0).toUpperCase() }}
          </div>
        }
      </div>
      <div>
        <h3 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">{{ this.user?.name }}</h3>
        <p class="text-slate-400 text-xs sm:text-sm mt-0.5">{{ this.user?.email }}</p>
      </div>
    </div>
    
    <div class="space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-2xl bg-slate-800/50 border border-slate-700/50 gap-1 sm:gap-4">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nome Completo</span>
        <span class="text-white text-sm font-semibold">{{ this.user.name }}</span>
      </div>
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-2xl bg-slate-800/50 border border-slate-700/50 gap-1 sm:gap-4">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Email</span>
        <span class="text-white text-sm font-semibold">{{ this.user.email }}</span>
      </div>
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-2xl bg-slate-800/50 border border-slate-700/50 gap-1 sm:gap-4">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Senha</span>
        <span class="text-white text-sm font-semibold tracking-widest">••••••••••••</span>
      </div>
    </div>
    
    <div class="pt-4 border-t border-slate-700/60 flex justify-end">
      <button (click)="editProfile()" 
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-xs sm:text-sm shadow-md shadow-indigo-600/30 transition-all cursor-pointer">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>Editar Perfil</span>
      </button>
    </div>

  </div>
</div>
