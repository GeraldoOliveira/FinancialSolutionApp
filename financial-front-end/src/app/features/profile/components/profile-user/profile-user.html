<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações de Perfil - Dashboard Financeiro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJj7Qn92tPzN92VpL/A2T8N3oA6K4T2F4F7v5F7X5I2C5Y8N9oD2F7Z5N6X5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* Estilos customizados para simular o dark theme do Tailwind no Bootstrap */
        body {
            /* Cor de fundo dark customizada */
            background-color: #121212; 
            color: #d1d5db; /* text-gray-200 */
            font-family: 'Manrope', sans-serif;
        }
        /* Cor primária customizada (E53935) */
        .bg-danger, .text-danger, .border-danger {
            --bs-danger: #E53935 !important;
        }
        .bg-card-dark { 
            background-color: #1E1E1E !important; 
        }
        /* Estilo para as abas ativas/inativas */
        .nav-tabs .nav-link {
            color: #6c757d; /* text-gray-400 */
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease-in-out, border-color 0.15s ease-in-out;
        }
        .nav-tabs .nav-link:hover {
            color: #adb5bd; /* hover:text-gray-300 */
            border-bottom-color: #6c757d; /* hover:border-gray-500 */
        }
        .nav-tabs .nav-link.active {
            color: #E53935 !important; /* text-primary */
            border-bottom-color: #E53935 !important; /* border-primary */
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="d-flex min-vh-100">

            </header>

                    <a class="nav-link active px-1 py-3" href="#">Perfil</a>
                    <a class="nav-link px-1 py-3" href="#">Editar Perfil</a>
                    <a class="nav-link px-1 py-3" href="#">Configurações</a>
                    <a class="nav-link px-1 py-3" href="#">Segurança</a>
                </nav>
            </div>
            
            <div class="card bg-card-dark rounded-4 shadow-lg border-0 p-3 p-sm-4">
                
                <div class="d-flex flex-column align-items-center gap-3 text-center mb-4">
                    <div class="position-relative">
                        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1nSv-MJ7FN2z996Wvd3SNd_NWhEG3E7IctFM_Av4J8EzrDmKPF9J1QkAZaTO2-bAgqDedMmovwASxMWDQZPRyNzwj_fWCbHzeyaKYSMwzQfCkp0esEKHyQYwqyJuCBX1bcY7PmhlhWFJC0DF6lJ5ORpLqgYnxlYKibGgZw4d9UWqVSR6NyrdFVaGfJopa0SWHZhub16iDB4oepT4_fGRLxMOkw124x4gzjTpyA0pWWgIyKghDzFuwAVNd7H0E753tGDhvK9_fqfo" alt="User avatar of Geraldo Oliveira Neto" class="rounded-circle border border-danger border-4" style="width: 128px; height: 128px; object-fit: cover;">
                    </div>
                    <div>
                        <p class="text-white fs-5 fw-bold mb-0">Geraldo Oliveira Neto</p>
                        <p class="text-secondary small m-0">gebruario@email.com</p>
                    </div>
                </div>
                
                <div class="d-flex flex-column gap-3">
                    
                    <div class="d-flex flex-column gap-1 gap-sm-0 flex-sm-row align-items-sm-center justify-content-between py-2">
                        <p class="text-secondary small m-0">Nome Completo</p>
                        <p class="text-white fw-medium m-0">Geraldo Oliveira Neto</p>
                    </div>
                    <hr class="border-light border-opacity-10 my-0"/>
                    
                    <div class="d-flex flex-column gap-1 gap-sm-0 flex-sm-row align-items-sm-center justify-content-between py-2">
                        <p class="text-secondary small m-0">Email</p>
                        <p class="text-white fw-medium m-0">gebruario@email.com</p>
                    </div>
                    <hr class="border-light border-opacity-10 my-0"/>
                    
                    <div class="d-flex flex-column gap-1 gap-sm-0 flex-sm-row align-items-sm-center justify-content-between py-2">
                        <p class="text-secondary small m-0">Senha</p>
                        <p class="text-white fw-medium m-0" style="letter-spacing: 0.2em;">************</p>
                    </div>
                </div>
                
                <div class="mt-4 d-flex justify-content-end">
                    <button class="btn btn-danger fw-bold py-2 px-4 d-flex align-items-center justify-content-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i>
                        Editar Perfil
                    </button>

            </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
