<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações de Perfil - FamilyControl (Bootstrap 5)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJj7Qn92tPzN92VpL/A2T8N3oA6K4T2F4F7v5F7X5I2C5Y8N9oD2F7Z5N6X5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* Estilos customizados para simular o dark theme do Tailwind no Bootstrap */
        body {
            background-color: #0a0a0a; /* background-dark */
            color: #f2f2f7; /* Cor do texto light/white */
            font-family: 'Manrope', sans-serif;
        }
        /* Mapeamento da cor primária (E53935) */
        .btn-danger, .text-danger, .form-control:focus, .form-select:focus {
            --bs-danger: #E53935 !important;
            --bs-btn-bg: #E53935 !important;
            --bs-btn-border-color: #E53935 !important;
            --bs-focus-ring-color: rgba(229, 57, 53, 0.25) !important;
        }
        .bg-card-dark { 
            background-color: #1c1c1e !important; 
        }
        .form-control, .form-select {
            background-color: rgba(58, 58, 60, 0.5) !important; /* bg-[#3a3a3c]/50 */
            border-color: #3a3a3c !important;
            color: #f2f2f7 !important;
        }
        .form-control[readonly] {
            background-color: rgba(58, 58, 60, 0.5) !important;
            color: #8e8e93 !important; /* Cor do texto para input readonly */
        }
        .form-control::placeholder {
            color: rgba(142, 142, 147, 0.7) !important; /* placeholder:text-[#8e8e93]/70 */
        }
        .ring-offset-dark-simulated {
            --bs-ring-offset-color: #1c1c1e !important;
        }
    </style>
</head>
<body class="bg-dark text-light">

<div class="d-flex w-100 min-vh-100 flex-column">
    <main class="flex-grow-1 d-flex flex-column align-items-center p-3 p-sm-4 p-md-5">
        <div class="w-100" style="max-width: 800px;">
            
            <header class="mb-4">
                <h1 class="text-3xl fw-bold text-white">Profile Settings</h1>
                <p class="fs-6 text-secondary mt-2">Manage your profile, security, and notification settings.</p>
            </header>
            
            <div class="d-flex gap-3 border-bottom border-secondary mb-4 flex-wrap">
                <a class="nav-link active px-3 py-3 text-sm fw-medium border-danger border-bottom-2" aria-current="page" href="#">Edit User Profile</a>
                <a class="nav-link px-3 py-3 text-secondary text-sm fw-medium border-bottom-2 border-transparent hover-link" href="#">Security</a>
                <a class="nav-link px-3 py-3 text-secondary text-sm fw-medium border-bottom-2 border-transparent hover-link" href="#">Notifications</a>
            </div>
            
            <div class="card bg-card-dark rounded-4 shadow-lg border-0 p-4 p-sm-5">
                <h3 class="fs-4 fw-bold text-light mb-4 text-center text-sm-start">Editar Informações</h3>
                
                <div class="d-flex flex-column align-items-center gap-3 mb-4">
                    <div class="position-relative">
                        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHdxqu57ulcq2CYKd1AA_ZwvV9Nwp_E86JugxvxzUYYoYYAZFA2zVckzSGVPkXbwlPyZebJJUqACgGHUBgdhVVSwvODo6u1mRZfcOVSPqvqdq4W4jaEGwNZNVL7Vrj1Y-BFislSkQDczdVTY4bmqWSBh8JurgZ-wYETKGPI5sUSGsN0OckbfwOaonVSM27L_W7oFRMWLjBCQs5e_jO51AP19bucfhv2mn4s_ZCSR2E0S0nObN6v0F1ivAP6wWQgcYjtCCpcVPlekE" alt="User avatar placeholder" class="rounded-circle border border-danger border-2 ring-offset-4 ring-offset-dark-simulated" style="width: 96px; height: 96px; object-fit: cover;">
                        <label for="photo-upload" class="position-absolute top-0 start-0 w-100 h-100 rounded-circle bg-black bg-opacity-50 d-flex align-items-center justify-content-center cursor-pointer opacity-0 transition-opacity hover-opacity-100" style="transition: opacity 0.2s;">
                             <i class="fa-solid fa-camera text-white fs-4"></i>
                        </label>
                        <input class="d-none" id="photo-upload" name="photo-upload" type="file"/>
                    </div>
                    
                    <div>
                        <label for="photo-upload" class="btn btn-sm btn-outline-light text-light fw-bold py-2 px-3 d-flex align-items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            Trocar foto
                        </label>
                    </div>
                </div>

                <form class="d-flex flex-column gap-3">
                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-2" for="fullName">Nome Completo</label>
                        <input class="form-control h-auto py-2" id="fullName" type="text" value="John Doe"/>
                    </div>
                    
                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-2" for="email">Email</label>
                        <input class="form-control h-auto py-2" id="email" readonly type="email" value="john.doe@example.com"/>
                    </div>
                    
                    <hr class="border-top border-secondary my-3"/>
                    
                    <h4 class="fs-5 fw-bold text-white">Alterar Senha</h4>
                    
                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-2" for="newPassword">Nova Senha</label>
                        <input class="form-control h-auto py-2" id="newPassword" placeholder="Deixe vazio para não alterar" type="password"/>
                    </div>
                    
                    <div class="mb-2">
                        <label class="form-label small text-secondary mb-2" for="confirmPassword">Confirmar Nova Senha</label>
                        <input class="form-control h-auto py-2" id="confirmPassword" type="password"/>
                    </div>
                    
                    <div class="d-flex flex-column-reverse flex-sm-row gap-3 mt-4 justify-content-sm-end">
                        <button type="button" class="btn btn-secondary fw-bold py-2 px-4 flex-grow-1 flex-sm-grow-0">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-danger fw-bold py-2 px-4 flex-grow-1 flex-sm-grow-0">
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
