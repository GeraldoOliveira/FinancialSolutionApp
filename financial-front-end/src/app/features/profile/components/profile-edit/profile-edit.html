<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações de Perfil - FamilyControl</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJj7Qn92tPzN92VpL/A2T8N3oA6K4T2F4F7v5F7X5I2C5Y8N9oD2F7Z5N6X5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="bg-color-actual">
    <div class="d-flex min-vh-100">
        <main class="flex-grow-1 p-3 p-sm-4 p-md-5">
            <div class="mx-auto" style="max-width: 800px;">
                
                <div class="card bg-card-dark text-white p-4 rounded-4 shadow-lg border-0 p-3 p-sm-4">
                    <h2 class="text-center mb-4 pt-1">Configurações de Perfil</h2>
                    
                    <div class="d-flex flex-column align-items-center gap-3 mb-4">
                        <div class="position-relative">
                            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHdxqu57ulcq2CYKd1AA_ZwvV9Nwp_E86JugxvxzUYYoYYAZFA2zVckzSGVPkXbwlPyZebJJUqACgGHUBgdhVVSwvODo6u1mRZfcOVSPqvqdq4W4jaEGwNZNVL7Vrj1Y-BFislSkQDczdVTY4bmqWSBh8JurgZ-wYETKGPI5sUSGsN0OckbfwOaonVSM27L_W7oFRMWLjBCQs5e_jO51AP19bucfhv2mn4s_ZCSR2E0S0nObN6v0F1ivAP6wWQgcYjtCCpcVPlekE" alt="User avatar placeholder" class="rounded-circle border border-white" style="width: 96px; height: 96px; object-fit: cover;">
                            <label for="photo-upload" class="position-absolute top-0 start-0 w-100 h-100 rounded-circle bg-black bg-opacity-50 d-flex align-items-center justify-content-center cursor-pointer opacity-0 transition-opacity hover-opacity-100">
                                <i class="fa-solid fa-camera text-white fs-4"></i>
                            </label>
                            <input class="d-none" id="photo-upload" name="photo-upload" type="file"/>
                        </div>
                        
                        <div>
                            <label for="photo-upload" class="btn btn-danger fw-bold py-2 px-3 d-flex align-items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                Trocar foto
                            </label>
                        </div>
                    </div>

                    <form class="d-flex flex-column gap-3">
                        
                        <div class="form-group mb-3">
                            <label class="control-label mb-2" for="fullName">Nome Completo:</label>
                            <input class="form-control" id="fullName" type="text" value="John Doe"/>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="control-label mb-2" for="email">Email:</label>
                            <input class="form-control" id="email" readonly type="email" value="john.doe@example.com"/>
                        </div>
                        
                        <hr class="border-top border-secondary my-3"/>
                        
                        <h3 class="text-white mb-3">Alterar Senha</h3>
                        
                        <div class="form-group mb-3">
                            <label class="control-label mb-2" for="newPassword">Nova Senha:</label>
                            <input class="form-control" id="newPassword" placeholder="Deixe vazio para não alterar" type="password"/>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="control-label mb-2" for="confirmPassword">Confirmar Nova Senha:</label>
                            <input class="form-control" id="confirmPassword" type="password"/>
                        </div>
                        
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-end mt-4">
                            <button type="button" class="btn btn-secondary fw-bold py-2 px-4 flex-grow-1 flex-sm-grow-0">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-danger fw-bold py-2 px-4 flex-grow-1 flex-sm-grow-0">
                                Salvar Alterações
                            </button>
                        </div>
                    </form>
                </div>
                
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
