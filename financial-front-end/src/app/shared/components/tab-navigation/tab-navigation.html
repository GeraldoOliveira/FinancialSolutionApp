<div class="mb-4 border-b border-slate-700/60 pb-3">
  <nav class="flex items-center gap-2" aria-label="Tabs">
    @for (tab of tabs; track tab.route) 
    {
      <a [routerLink]="tab.route"
        [routerLinkActive]="['bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/30']"
        (click)="selectTab(tab.route)"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800">
        {{ tab.label }}
      </a>
    }
  </nav>
</div>
