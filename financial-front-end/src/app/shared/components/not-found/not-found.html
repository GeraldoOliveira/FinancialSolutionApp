<html lang="pt-br">
<body class="bg-color-actual">
  <div class="container text-white pt-2">
    <div class="card bg-cinza-personalizado text-white p-5 rounded-3 register-card col-md-6 offset-md-3 shadow-lg">
      <div class="text-center mb-4">
        <i class="far fa-compass fa-6x text-info opacity-75"></i>
      </div>
      <h2 class="text-center mb-3">Ops! Caminho incorreto</h2>
      <div class="text-center mb-4 text-light opacity-75">
        <p class="fs-5">Não conseguimos encontrar a página que você procura.<br>Ela pode ter sido movida, deletada ou nunca existiu.</p>
      </div>
      <div class="d-grid gap-2 col-8 mx-auto">
        <button [routerLink]="['/dashboard']" class="btn btn-light btn-lg text-dark fw-bold">
          <i class="fas fa-home me-2"></i> Ir para o Dashboard
        </button>
      </div>
    </div>
  </div>
</body>
</html>
