<section class="min-h-[85vh] flex items-center justify-center py-10 px-4 bg-[#0B0F19]">
  <div class="max-w-md w-full">
    <div class="bg-slate-900/90 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl text-center space-y-4">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 text-3xl shadow-lg shadow-amber-500/10">
        <i class="fas fa-user-lock"></i>
      </div>
      <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Acesso Restrito</h2>
      <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">
        Parece que você não tem permissão para acessar esta área.<br>Entre em contato com o administrador caso precise de acesso.
      </p>
      <div class="pt-4 flex justify-center">
        <button [routerLink]="['/dashboard']" 
          class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl border border-slate-700 hover:border-slate-600 hover:bg-slate-800 text-slate-200 hover:text-white font-medium text-xs sm:text-sm transition-all shadow-md">
          <i class="fas fa-arrow-left"></i>
          <span>Voltar ao Dashboard</span>
        </button>
      </div>
    </div>
  </div>
</section>
